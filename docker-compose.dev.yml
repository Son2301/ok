# Postgres for local development only (the apps run on your machine with hot reload).
# Started automatically by `pnpm dev:setup` / `pnpm dev`. Port 5433 avoids clashing with a local Postgres.
name: minh-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: minh
      POSTGRES_PASSWORD: minh
      POSTGRES_DB: minh
    ports: ["5433:5432"]
    volumes: [minh-dev-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minh"]
      interval: 2s
      retries: 30
volumes:
  minh-dev-pg:
